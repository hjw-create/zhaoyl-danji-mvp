    <div class="warn"><strong>红线写在最前：</strong>非诊疗、不开药、不替代兽医、不卖兽药饲料。</div>
    <p class="p">有人原话：「网上开药我不敢信。」也有人说：「节点提醒可以，别一上来卖药卖料。」</p>
    <p class="p"><strong>能帮你的</strong>：提醒免疫/换料节点；记下产蛋与异常一句；一页纸、人话、换班也能勾。</p>
    <p class="p"><strong>不能帮你的</strong>：不下诊断、不开处方、不保证少生病、不绑兽药/饲料链接。</p>
    <p class="p">红线清楚，你再决定要不要试填。</p>
